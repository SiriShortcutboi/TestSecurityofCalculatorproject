<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circle Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      --bg: #1e1e1e;
      --card: #2d2d2d;
      --text: #fff;
      --muted: #b3b3b3;
      --blue: #3b82f6;
      --green: #10b981;
      --border: #404040;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 20%, #292929 0, #171717 65%);
      color: var(--text);
    }
    .window {
      width: min(100%, 430px);
      border: 1px solid #383838;
      border-radius: 18px;
      background: rgba(30, 30, 30, .96);
      box-shadow: 0 24px 80px #0009;
      overflow: hidden;
    }
    .topline { height: 4px; background: linear-gradient(90deg, var(--blue), var(--green)); }
    .content { padding: 30px; }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.03em; }
    .subtitle { margin: 9px 0 25px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 0 0 8px; color: var(--muted); font-size: 13px; }
    input {
      display: block;
      width: 100%;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      background: #242424;
      color: var(--text);
      font: inherit;
      padding: 0 13px;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #3b82f626; }
    .field { margin: 0 0 17px; }
    button {
      display: block;
      width: 100%;
      min-height: 45px;
      border: 1px solid #484848;
      border-radius: 9px;
      background: var(--card);
      color: var(--green);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .12s, background .12s;
    }
    button:hover { background: #383838; }
    button:active { transform: translateY(1px); }
    .error { min-height: 20px; margin: 11px 0 0; color: #f87171; font-size: 13px; }
    .hint {
      margin-top: 18px;
      padding: 12px 13px;
      border: 1px solid #3d3d3d;
      border-radius: 9px;
      background: #252525;
      color: #a9a9a9;
      font-size: 12px;
      line-height: 1.55;
    }
    .hint strong { color: #ddd; }
    .calculator { display: none; }
    .calculator h1 { text-align: center; }
    .calculator .subtitle { text-align: center; margin-bottom: 26px; }
    .radius-row { display: grid; grid-template-columns: 1fr 1.25fr; align-items: center; gap: 12px; }
    .radius-row label { margin: 0; }
    .radius-row input { text-align: center; }
    .calculator button { margin: 16px 0 18px; }
    .results {
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--card);
      padding: 16px 17px 8px;
    }
    .results-title { margin: 0 0 7px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .05em; }
    .result {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 0;
      border-bottom: 1px solid #3a3a3a;
      color: var(--muted);
      font-size: 14px;
    }
    .result:last-child { border-bottom: 0; }
    .result output { color: var(--text); font-weight: 700; }
    .result:nth-child(3) output { color: #60a5fa; }
    .result:nth-child(4) output { color: var(--green); }
    .logout {
      margin-top: 17px;
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 12px;
      font-weight: 400;
    }
    .logout:hover { background: #282828; }
    @media (max-width: 420px) { .content { padding: 24px 21px; } }
  </style>
</head>
<body>
  <main class="window">
    <div class="topline"></div>
    <section class="content" id="login">
      <p class="eyebrow">Demo access</p>
      <h1>System Login</h1>
      <p class="subtitle">Sign in to open the circle calculator.</p>
      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Login</button>
        <p class="error" id="login-error" role="alert"></p>
      </form>
    </section>

    <section class="content calculator" id="calculator">
      <p class="eyebrow">Geometry tool</p>
      <h1>Circle Calculator</h1>
      <p class="subtitle">Enter a radius to calculate area and circumference.</p>
      <form id="calc-form">
        <div class="radius-row">
          <label for="radius">Enter radius</label>
          <input id="radius" type="text" placeholder="e.g. 5" autocomplete="off">
        </div>
        <button type="submit">Calculate</button>
        <p class="error" id="radius-error" role="alert"></p>
      </form>
      <section class="results" aria-live="polite">
        <p class="results-title">RESULTS</p>
        <div class="result"><span>Radius</span><output id="out-radius">—</output></div>
        <div class="result"><span>Area</span><output id="out-area">—</output></div>
        <div class="result"><span>Circumference</span><output id="out-circumference">—</output></div>
      </section>
      <button class="logout" id="logout" type="button">Sign out</button>
    </section>
  </main>
  <script>
    const login = document.getElementById("login");
    const calculator = document.getElementById("calculator");
    const loginForm = document.getElementById("login-form");
    const password = document.getElementById("password");
    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      if (username === "admin" && password.value === "password123") {
        login.style.display = "none";
        calculator.style.display = "block";
        document.getElementById("radius").focus();
      } else {
        document.getElementById("login-error").textContent = "Invalid username or password.";
        password.select();
      }
    });
    document.getElementById("calc-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const rawRadius = document.getElementById("radius").value.trim();
      const radius = Number(rawRadius);
      const error = document.getElementById("radius-error");
      if (rawRadius === "" || !Number.isFinite(radius)) {
        error.textContent = "Please enter a valid numeric radius.";
        return;
      }
      error.textContent = "";
      document.getElementById("out-radius").textContent = String(radius);
      document.getElementById("out-area").textContent = (Math.PI * radius ** 2).toFixed(2);
      document.getElementById("out-circumference").textContent = (2 * Math.PI * radius).toFixed(2);
    });
    document.getElementById("logout").addEventListener("click", () => {
      calculator.style.display = "none";
      login.style.display = "block";
      loginForm.reset();
      document.getElementById("login-error").textContent = "";
      document.getElementById("username").focus();
    });
  </script>
</body>
</html>
